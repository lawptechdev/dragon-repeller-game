<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>RPG - Dragon Repeller</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0 p-0 h-full overflow-hidden font-mono">
    <!-- Background image -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden opacity-75 z-[-1]">
      <img class="w-full h-full object-cover" src="./asset/images/dragon-repeller-bg.png" alt="dragon repeller background">
    </div>
    <!-- Background music -->
    <audio id="bg-music" autoplay loop muted>
      <source src="./asset/music/adventure-music-164795.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
    <!-- Game window -->
    <div class="max-w-170 max-h-500 bg-orange-700 mt-[30px] mx-auto p-5" id="game">
      <div class="border">
        <div class="p-5 text-black" id="stats">
          <span class="stat pr-5">XP: <strong><span id="xpText">0</span></strong></span>
          <span class="stat pr-5">Health: <strong><span id="healthText">100</span></strong></span>
          <span class="stat pr-5">Gold: <strong><span id="goldText">50</span></strong></span>
        </div>
        <div class="bg-yellow-500 text-black p-5" id="text">
          Welcome to Dragon Repeller. You must defeat the dragon that is preventing people from leaving the town. You are in the town square. Where do you want to go? Use the buttons above.
        </div>
        <div class="hidden p-5 bg-orange-900 text-white" id="monsterStats">
          <span class="stat pr-5">Monster Name: <strong><span id="monsterName"></span></strong></span>
          <span class="stat pr-5">Health: <strong><span id="monsterHealth"></span></strong></span>
        </div>
        <div class="p-5 text-black" id="controls">
          <button class="cursor-pointer p-1 text-black bg-yellow-500 bg-[linear-gradient(#fecc4c,#ffac33)] border-[3px] border-solid border-[#feac32]" id="button1">Go to store</button>
          <button class="cursor-pointer p-1 text-black bg-yellow-500 bg-[linear-gradient(#fecc4c,#ffac33)] border-[3px] border-solid border-[#feac32]" id="button2">Go to cave</button>
          <button class="cursor-pointer p-1 text-black bg-yellow-500 bg-[linear-gradient(#fecc4c,#ffac33)] border-[3px] border-solid border-[#feac32]" id="button3">Fight dragon</button>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
